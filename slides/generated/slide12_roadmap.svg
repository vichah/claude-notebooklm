<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#AED6F1"/>
    </marker>
  </defs>

  <rect width="900" height="260" fill="#F7F9FC" rx="12"/>

  <!-- 標題 -->
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1A3A5C">三階段導入路線圖</text>

  <!-- 時間軸主線 -->
  <line x1="60" y1="110" x2="840" y2="110" stroke="#AED6F1" stroke-width="3"/>
  <line x1="835" y1="105" x2="845" y2="110" stroke="#AED6F1" stroke-width="3"/>
  <line x1="835" y1="115" x2="845" y2="110" stroke="#AED6F1" stroke-width="3"/>

  <!-- 起點 -->
  <circle cx="60" cy="110" r="8" fill="#1A3A5C"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#5D6D7E">現在</text>

  <!-- Phase 1 節點 -->
  <circle cx="240" cy="110" r="16" fill="#1A3A5C"/>
  <text x="240" y="115" text-anchor="middle" font-size="14" fill="white" font-weight="700">1</text>
  <!-- Phase 1 上方內容 -->
  <rect x="130" y="34" width="220" height="62" rx="8" fill="#1A3A5C"/>
  <text x="240" y="58" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.8)">第一階段</text>
  <text x="240" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="white">習慣 AI 協作</text>
  <line x1="240" y1="96" x2="240" y2="94" stroke="#1A3A5C" stroke-width="2"/>
  <line x1="240" y1="94" x2="240" y2="96" stroke="#AED6F1" stroke-width="2" stroke-dasharray="3,2"/>
  <line x1="240" y1="126" x2="240" y2="148" stroke="#AED6F1" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Phase 1 下方 -->
  <rect x="140" y="148" width="200" height="50" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="240" y="168" text-anchor="middle" font-size="13" fill="#1A3A5C" font-weight="600">✅ 評估指標</text>
  <text x="240" y="186" text-anchor="middle" font-size="12" fill="#5D6D7E">人員願意使用 · 節省時間</text>

  <!-- Phase 2 節點 -->
  <circle cx="500" cy="110" r="16" fill="#2980B9"/>
  <text x="500" y="115" text-anchor="middle" font-size="14" fill="white" font-weight="700">2</text>
  <!-- Phase 2 上方內容 -->
  <rect x="388" y="34" width="224" height="62" rx="8" fill="#2980B9"/>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.8)">第二階段</text>
  <text x="500" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="white">串接 Google Workspace</text>
  <line x1="500" y1="126" x2="500" y2="148" stroke="#AED6F1" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Phase 2 下方 -->
  <rect x="400" y="148" width="200" height="50" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="500" y="168" text-anchor="middle" font-size="13" fill="#1A3A5C" font-weight="600">✅ 評估指標</text>
  <text x="500" y="186" text-anchor="middle" font-size="12" fill="#5D6D7E">AI 解析正確率 · 節省人工</text>

  <!-- Phase 3 節點 -->
  <circle cx="760" cy="110" r="16" fill="#1E8449"/>
  <text x="760" y="115" text-anchor="middle" font-size="14" fill="white" font-weight="700">3</text>
  <!-- Phase 3 上方內容 -->
  <rect x="648" y="34" width="224" height="62" rx="8" fill="#1E8449"/>
  <text x="760" y="58" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.8)">第三階段</text>
  <text x="760" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="white">連接 ERP 自動輸入</text>
  <line x1="760" y1="126" x2="760" y2="148" stroke="#A9DFBF" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Phase 3 下方 -->
  <rect x="660" y="148" width="200" height="50" rx="8" fill="#F0FAF4" stroke="#A9DFBF" stroke-width="1.5"/>
  <text x="760" y="168" text-anchor="middle" font-size="13" fill="#1E8449" font-weight="600">✅ 評估指標</text>
  <text x="760" y="186" text-anchor="middle" font-size="12" fill="#5D6D7E">自動化比例 · 錯誤率</text>

  <!-- 底部原則 -->
  <text x="450" y="230" text-anchor="middle" font-size="13" fill="#1A3A5C" font-weight="700">💡 關鍵原則：先從最痛的一個流程開始，做出成果後再逐步擴大</text>
</svg>

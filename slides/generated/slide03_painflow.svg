<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#2980B9"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="240" fill="#F7F9FC" rx="12"/>

  <!-- 標題 -->
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">目前訂單處理流程（痛點分佈）</text>

  <!-- 步驟盒子 -->
  <!-- Step 1: 客戶來信 -->
  <rect x="20" y="60" width="110" height="60" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="75" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">📧 客戶</text>
  <text x="75" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">來信訂單</text>

  <!-- Arrow -->
  <line x1="130" y1="90" x2="158" y2="90" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2: 人工閱讀 -->
  <rect x="160" y="60" width="110" height="60" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="215" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">👤 人工</text>
  <text x="215" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">閱讀判斷</text>

  <!-- 痛點 1 -->
  <rect x="175" y="130" width="80" height="36" rx="6" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="215" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#C0392B">⚠️ 痛點①</text>
  <text x="215" y="160" text-anchor="middle" font-size="10" fill="#922B21">格式不統一</text>
  <line x1="215" y1="120" x2="215" y2="130" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Arrow -->
  <line x1="270" y1="90" x2="298" y2="90" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: 單位換算 -->
  <rect x="300" y="60" width="120" height="60" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="360" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">🔄 單位</text>
  <text x="360" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">換算判斷</text>

  <!-- 痛點 2 -->
  <rect x="315" y="130" width="90" height="36" rx="6" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="360" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#C0392B">⚠️ 痛點②</text>
  <text x="360" y="160" text-anchor="middle" font-size="10" fill="#922B21">M數/盒/重量混用</text>
  <line x1="360" y1="120" x2="360" y2="130" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Arrow -->
  <line x1="420" y1="90" x2="448" y2="90" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4: 包裝計算 -->
  <rect x="450" y="60" width="120" height="60" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="510" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">📦 包裝</text>
  <text x="510" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">階層計算</text>

  <!-- 痛點 3 -->
  <rect x="460" y="130" width="100" height="36" rx="6" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="510" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#C0392B">⚠️ 痛點③</text>
  <text x="510" y="160" text-anchor="middle" font-size="10" fill="#922B21">多層包裝不固定</text>
  <line x1="510" y1="120" x2="510" y2="130" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Arrow -->
  <line x1="570" y1="90" x2="598" y2="90" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5: 子訂單拆分 -->
  <rect x="600" y="60" width="120" height="60" rx="8" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="660" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">✂️ 子訂單</text>
  <text x="660" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1A3A5C">人工拆分</text>

  <!-- 痛點 4 -->
  <rect x="610" y="130" width="100" height="36" rx="6" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="660" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#C0392B">⚠️ 痛點④</text>
  <text x="660" y="160" text-anchor="middle" font-size="10" fill="#922B21">頁數筆數不固定</text>
  <line x1="660" y1="120" x2="660" y2="130" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Arrow -->
  <line x1="720" y1="90" x2="748" y2="90" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6: ERP 輸入 -->
  <rect x="750" y="60" width="120" height="60" rx="8" fill="#D5F5E3" stroke="#A9DFBF" stroke-width="1.5"/>
  <text x="810" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#1E8449">💾 人工</text>
  <text x="810" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#1E8449">輸入ERP</text>

  <!-- 時間成本標示 -->
  <rect x="740" y="130" width="140" height="36" rx="6" fill="#FEF9E7" stroke="#F9CA45" stroke-width="1.5"/>
  <text x="810" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#7D6608">⏱ 每份訂單</text>
  <text x="810" y="160" text-anchor="middle" font-size="10" fill="#7D6608">耗時 1~2 小時以上</text>
  <line x1="810" y1="120" x2="810" y2="130" stroke="#E6AC00" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- 底部說明 -->
  <text x="450" y="215" text-anchor="middle" font-size="11" fill="#5D6D7E">核心問題：每個環節都需要「人工讀懂文字判斷」，無法靠傳統規則自動化</text>
</svg>

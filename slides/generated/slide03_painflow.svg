<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Microsoft JhengHei','PingFang TC',sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#2980B9"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="300" fill="#F7F9FC" rx="12"/>

  <!-- 標題 -->
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1A3A5C">目前訂單處理流程（痛點分佈）</text>

  <!-- ── 步驟盒子（y=52, height=72, center=88） ── -->

  <!-- Box1: 客戶來信 -->
  <rect x="18" y="52" width="112" height="72" rx="9" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="74" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">📧 客戶</text>
  <text x="74" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">來信訂單</text>

  <line x1="130" y1="88" x2="156" y2="88" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box2: 人工閱讀 -->
  <rect x="158" y="52" width="112" height="72" rx="9" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="214" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">👤 人工</text>
  <text x="214" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">閱讀判斷</text>

  <!-- Pain 1 -->
  <rect x="168" y="136" width="92" height="46" rx="7" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="214" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">⚠️ 痛點①</text>
  <text x="214" y="173" text-anchor="middle" font-size="12" fill="#922B21">格式不統一</text>
  <line x1="214" y1="124" x2="214" y2="136" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <line x1="270" y1="88" x2="296" y2="88" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box3: 單位換算 -->
  <rect x="298" y="52" width="122" height="72" rx="9" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="359" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">🔄 單位</text>
  <text x="359" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">換算判斷</text>

  <!-- Pain 2 -->
  <rect x="302" y="136" width="114" height="46" rx="7" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="359" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">⚠️ 痛點②</text>
  <text x="359" y="173" text-anchor="middle" font-size="11" fill="#922B21">M數/盒/重量混用</text>
  <line x1="359" y1="124" x2="359" y2="136" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <line x1="420" y1="88" x2="446" y2="88" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box4: 包裝計算 -->
  <rect x="448" y="52" width="122" height="72" rx="9" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="509" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">📦 包裝</text>
  <text x="509" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">階層計算</text>

  <!-- Pain 3 -->
  <rect x="452" y="136" width="114" height="46" rx="7" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="509" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">⚠️ 痛點③</text>
  <text x="509" y="173" text-anchor="middle" font-size="12" fill="#922B21">多層包裝不固定</text>
  <line x1="509" y1="124" x2="509" y2="136" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <line x1="570" y1="88" x2="596" y2="88" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box5: 子訂單拆分 -->
  <rect x="598" y="52" width="122" height="72" rx="9" fill="#EBF5FB" stroke="#AED6F1" stroke-width="1.5"/>
  <text x="659" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">✂️ 子訂單</text>
  <text x="659" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1A3A5C">人工拆分</text>

  <!-- Pain 4 -->
  <rect x="602" y="136" width="114" height="46" rx="7" fill="#FADBD8" stroke="#F1948A" stroke-width="1.5"/>
  <text x="659" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">⚠️ 痛點④</text>
  <text x="659" y="173" text-anchor="middle" font-size="12" fill="#922B21">頁數筆數不固定</text>
  <line x1="659" y1="124" x2="659" y2="136" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <line x1="720" y1="88" x2="746" y2="88" stroke="#2980B9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Box6: ERP 輸入 -->
  <rect x="748" y="52" width="132" height="72" rx="9" fill="#D5F5E3" stroke="#A9DFBF" stroke-width="1.5"/>
  <text x="814" y="83" text-anchor="middle" font-size="15" font-weight="700" fill="#1E8449">💾 人工</text>
  <text x="814" y="103" text-anchor="middle" font-size="15" font-weight="700" fill="#1E8449">輸入 ERP</text>

  <!-- 時間成本標示 -->
  <rect x="742" y="136" width="144" height="46" rx="7" fill="#FEF9E7" stroke="#F9CA45" stroke-width="1.5"/>
  <text x="814" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#7D6608">⏱ 每份訂單</text>
  <text x="814" y="173" text-anchor="middle" font-size="12" fill="#7D6608">耗時動輒數小時</text>
  <line x1="814" y1="124" x2="814" y2="136" stroke="#E6AC00" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- 底部說明 -->
  <text x="450" y="250" text-anchor="middle" font-size="13" fill="#5D6D7E">核心問題：每個環節都需要「人工讀懂文字判斷」，無法靠傳統規則自動化</text>
</svg>
